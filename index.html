<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Отчет экспедитора</title>
    
    <!-- PWA Настройки -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#f59e0b">
    <meta name="mobile-web-app-capable" content="yes">

    <!-- Настройки для iOS Safari -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Отчет">
    <link rel="apple-touch-icon" href="./icon-192.png">

    <style>
        * {
            box-sizing: border-box;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; 
            background: #f4f4f5; 
            color: #18181b; 
            padding: 12px; 
            margin: 0;
            display: flex; 
            justify-content: center;
        }

        .card { 
            background: #ffffff; 
            width: 100%; 
            max-width: 480px; 
            padding: 20px; 
            border-radius: 8px; 
            border-top: 4px solid #f59e0b;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08); 
        }

        .header { 
            margin-bottom: 14px; 
            border-bottom: 1px solid #e4e4e7; 
            padding-bottom: 10px; 
        }
        .header h2 { 
            margin: 0 0 4px; 
            font-size: 18px; 
            text-transform: uppercase; 
        }
        .header p { 
            margin: 0; 
            font-size: 13px; 
            color: #71717a; 
        }
        
        .badge { 
            padding: 8px 12px; 
            border-radius: 6px; 
            font-size: 13px; 
            font-weight: 600; 
            margin-bottom: 14px; 
            text-align: center;
        }
        .online { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
        .offline { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }

        #installAppBtn {
            display: none;
            width: 100%;
            background: #18181b;
            color: #ffffff;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            margin-bottom: 14px;
        }

        .field { margin-bottom: 14px; }
        .row-2 { display: flex; gap: 10px; }
        .row-2 .field { flex: 1; margin-bottom: 0; }
        
        label { 
            display: block; 
            margin-bottom: 5px; 
            font-size: 13px; 
            font-weight: 600; 
            color: #3f3f46; 
        }
        
        /* Стандартные свойства appearance + кроссбраузерный префикс */
        input[type="text"], 
        input[type="number"], 
        textarea { 
            width: 100%; 
            padding: 10px 12px; 
            font-size: 16px; 
            border: 1px solid #d4d4d8; 
            border-radius: 6px; 
            background: #ffffff;
            color: #18181b;
            -webkit-appearance: none;
            appearance: none;
        }
        input:focus, textarea:focus { 
            border-color: #f59e0b; 
            outline: none; 
        }

        textarea {
            resize: vertical;
            min-height: 54px;
        }
        
        input[type="file"] { 
            width: 100%;
            padding: 8px; 
            background: #fafafa; 
            font-size: 16px; 
            cursor: pointer; 
            border: 1px dashed #d4d4d8;
            border-radius: 6px;
        }

        #photoFileName { 
            font-size: 13px; 
            color: #166534; 
            margin-top: 6px; 
            display: none; 
            font-weight: 600; 
            word-break: break-all;
        }

        button.submit-btn { 
            width: 100%; 
            padding: 14px; 
            background: #f59e0b; 
            color: #18181b; 
            font-size: 16px; 
            font-weight: bold; 
            text-transform: uppercase; 
            border: none; 
            border-radius: 6px; 
            cursor: pointer; 
            margin-top: 8px; 
        }
        button.submit-btn:disabled { 
            background: #e4e4e7; 
            color: #a1a1aa; 
            cursor: not-allowed; 
        }
        
        #status { 
            margin-top: 14px; 
            padding: 10px; 
            background: #f4f4f5; 
            font-size: 13px; 
            text-align: center; 
            border-radius: 6px; 
            border: 1px solid #e4e4e7; 
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="card">
        <button id="installAppBtn" type="button">📲 Установить приложение на телефон</button>

        <div id="netStatus" class="badge online">● Подключение: Онлайн</div>

        <div class="header">
            <h2>Отчет экспедитора</h2>
            <p>Фиксация путевых показателей</p>
        </div>

        <form id="reportForm" onsubmit="return false;">

            <div class="field">
                <label for="username">ФИО водителя (сохраняется):</label>
                <input type="text" id="username" placeholder="Иванов И.И." autocomplete="name">
            </div>

            <div class="field">
                <label for="pointName">1. Торговая точка *</label>
                <input type="text" id="pointName" placeholder="Наименование или адрес" autocomplete="off">
            </div>

            <div class="field">
                <label for="meter">2. Показания счетчика</label>
                <input type="number" id="meter" inputmode="numeric" placeholder="Значение" min="0">
            </div>

            <div class="field row-2">
                <div class="field">
                    <label for="smallToys">3. Мелкие игрушки</label>
                    <input type="number" id="smallToys" inputmode="numeric" placeholder="Шт." min="0">
                </div>
                <div class="field">
                    <label for="zamanukha">4. Заманухи</label>
                    <input type="number" id="zamanukha" inputmode="numeric" placeholder="Шт." min="0">
                </div>
            </div>

            <div class="field">
                <label for="probros">5. Проброс</label>
                <input type="text" id="probros" placeholder="Количество или статус">
            </div>

            <div class="field">
                <label for="problems">6. Проблемы на маршруте</label>
                <textarea id="problems" rows="2" placeholder="Комментарий (при наличии)"></textarea>
            </div>

            <div class="field">
                <label for="photo">7. Фотография (камера / галерея)</label>
                <input type="file" id="photo" accept="image/*">
                <div id="photoFileName"></div>
            </div>

            <button id="submitBtn" class="submit-btn" type="button">Отправить данные</button>
        </form>

        <div id="status">Готово к заполнению</div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const photoEl = document.getElementById('photo');
            const photoLabel = document.getElementById('photoFileName');
            if (photoEl && photoLabel) {
                photoEl.addEventListener('change', function() {
                    if (this.files && this.files[0]) {
                        photoLabel.style.display = 'block';
                        photoLabel.innerText = '✅ Выбран файл: ' + this.files[0].name;
                    } else {
                        photoLabel.style.display = 'none';
                    }
                });
            }
        });
    </script>
    <script src="./app.js?v=13"></script>
</body>
</html>
